[package]
name = "mathalea-mobile"
version = "0.2.3"
description = "Parcours MathALÉA hors ligne"
authors = ["CoopMaths"]
license = "AGPL-3.0-or-later"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mathalea_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Plugin Swift de l'app (build.rs), seulement pour compiler vers iOS
[target.'cfg(target_os = "macos")'.build-dependencies]
tauri-utils = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }
tauri-plugin-http = "2.8.2"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-fs = "2.7.0"
ed25519-dalek = "3.0.0"
sha2 = "0.11.1"
flate2 = "1.1.10"
tar = "0.4.46"
base64 = "0.23.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }


# Binaire léger : l'interface (moteur MathALÉA compris) est compilée dedans
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
