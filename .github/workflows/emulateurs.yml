# L'app sur de vrais appareils virtuels, avec notre moteur (scripts/moteur.sh) :
# - Android : APK de débogage (WebView inspectable) sur un émulateur Android 11
#   (API 30) et un Android récent (API 35), pilotée comme un élève par
#   e2e/appareil-android.mjs (vrais touchers, clavier de MathALÉA, bilan) ;
# - iPhone : simulateur iOS sur macOS, build de débogage piloté comme un élève
#   par Appium (XCUITest) : e2e/appareil-ios.mjs, mêmes étapes qu'Android.
# Captures et journaux en artefacts. Aucune clé ni aucun envoi.
name: emulateurs

on:
  workflow_dispatch:
  # Branche de travail de Claude (essais sans lancement manuel possible)
  push:
    branches: [ccr-3626951a-ud6bbr]

permissions:
  contents: read

jobs:
  # Notre moteur, construit une fois sous Linux (sous macOS, pnpm ne passe pas
  # à la version demandée par MathALÉA) et donné à l'APK et à l'iPhone
  moteur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Version de pnpm : champ packageManager de package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Moteur dans l'app
        run: bash scripts/moteur.sh
      - uses: actions/upload-artifact@v7
        with:
          name: moteur
          path: static/moteur

  apk:
    needs: moteur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/download-artifact@v8
        with:
          name: moteur
          path: static/moteur
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: NDK et plateforme Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: emulateur
      - run: pnpm install --frozen-lockfile
      - name: APK de débogage
        env:
          NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: |
          pnpm tauri android build --debug --apk --target x86_64
          mkdir -p apk
          cp "$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)" apk/MathALEA-emulateur.apk
      - uses: actions/upload-artifact@v7
        with:
          name: apk-emulateur
          path: apk/MathALEA-emulateur.apk

  android:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: apk-emulateur
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Émulateur Android ${{ matrix.api }}
        timeout-minutes: 25
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          # Même dossier d'appareils virtuels pour avdmanager et l'émulateur
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          image="system-images;android-${{ matrix.api }};google_apis;x86_64"
          yes | "$sdk/sdkmanager" --licenses > /dev/null
          "$sdk/sdkmanager" emulator platform-tools "$image" > /dev/null
          echo no | "$sdk/avdmanager" create avd -n essai -k "$image" -d pixel_5 --force
          nohup "$ANDROID_HOME/emulator/emulator" -avd essai -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -memory 4096 > emulateur.log 2>&1 &
          emulateur=$!
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          # Démarrage : 15 min au plus (arrêt dès que l'émulateur se ferme), sinon son journal
          if ! timeout 900 bash -c "until [ \"\$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')\" = 1 ]; do kill -0 $emulateur || exit 1; sleep 5; done"; then
            echo "::error::L'émulateur n'a pas démarré"
            cat emulateur.log
            adb devices -l || true
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r MathALEA-emulateur.apk
      # Android 11 de l'émulateur : WebView d'origine (Chrome 83). Un vrai téléphone
      # la met à jour par le Play Store : on installe une WebView récente
      # (Chromium) pour jouer l'élève comme sur ce téléphone. Sans elle, le test
      # vérifie l'écran « Mise à jour nécessaire ».
      - name: WebView récente
        if: matrix.api == 30
        continue-on-error: true
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          base=https://commondatastorage.googleapis.com/chromium-browser-snapshots/Android_x64
          rev=$(curl -sf "$base/LAST_CHANGE")
          curl -sfLo chromium.zip "$base/$rev/chrome-android.zip"
          unzip -q chromium.zip
          apk=$(find chrome-android -name 'SystemWebView*.apk' | head -1)
          echo "WebView : $apk (Chromium $rev)"
          adb install -r "$apk"
          adb shell cmd webviewupdate set-webview-implementation com.android.webview
          adb shell dumpsys webviewupdate | head -20
      - name: Élève sur l'app installée
        timeout-minutes: 20
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          CAPTURES="captures-android-${{ matrix.api }}" node e2e/appareil-android.mjs
      - name: Journal Android
        if: always()
        timeout-minutes: 3
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p "captures-android-${{ matrix.api }}"
          timeout 60 adb logcat -d > "captures-android-${{ matrix.api }}/logcat.txt" || true
          cp emulateur.log "captures-android-${{ matrix.api }}/" || true
      # Captures réduites aussi dans le journal (lisibles sans télécharger d'artefact)
      - name: Captures dans le journal
        if: always()
        run: |
          for f in captures-android-${{ matrix.api }}/*.png; do
            [ -e "$f" ] || continue
            echo "=== CAPTURE $(basename "$f" .png)"
            base64 -w0 "$f"
            echo
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: captures-android-${{ matrix.api }}
          path: captures-android-${{ matrix.api }}

  iphone:
    needs: moteur
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: emulateur
      - uses: actions/download-artifact@v8
        with:
          name: moteur
          path: static/moteur
      - run: pnpm install --frozen-lockfile
      - name: Projet Xcode
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            brew install xcodegen
            pnpm tauri ios init --ci
          fi
      - name: Simulateur
        run: pnpm tauri ios build --target aarch64-sim --debug
      - name: Simulateur iPhone
        run: |
          app=$(find src-tauri/gen/apple/build -name '*.app' -path '*simulator*' | head -1)
          [ -n "$app" ] || app=$(find src-tauri/gen/apple/build -name '*.app' | head -1)
          appareil=$(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8")).devices
            const t = Object.entries(d).filter(([k]) => k.includes("iOS")).flatMap(([, l]) => l)
            console.log((t.find((x) => /^iPhone \d+$/.test(x.name)) ?? t.find((x) => x.name.startsWith("iPhone"))).udid)')
          echo "APP=$PWD/$app" >> "$GITHUB_ENV"
          echo "APPAREIL=$appareil" >> "$GITHUB_ENV"
          xcrun simctl boot "$appareil"
          xcrun simctl bootstatus "$appareil" -b
      # Appium (XCUITest) et webdriverio, à part : rien dans package.json
      - name: Appium
        run: |
          npm install -g appium@3 > /dev/null
          appium driver install xcuitest
          nohup appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &
          mkdir -p "$RUNNER_TEMP/ios" && cd "$RUNNER_TEMP/ios" && npm init -y > /dev/null && npm install webdriverio@9 > /dev/null
      - name: Élève sur l'iPhone
        timeout-minutes: 40
        run: |
          cp e2e/appareil-ios.mjs "$RUNNER_TEMP/ios/"
          cd "$RUNNER_TEMP/ios"
          CAPTURES="$GITHUB_WORKSPACE/captures-iphone" node appareil-ios.mjs
      - name: Journal iPhone
        if: always()
        run: |
          mkdir -p captures-iphone
          cp appium.log captures-iphone/ || true
          tail -60 appium.log || true
          xcrun simctl spawn "$APPAREIL" log show --last 10m --predicate 'process == "mathalea-mobile"' --style compact | tail -300 > captures-iphone/journal.txt || true
      - name: Captures dans le journal
        if: always()
        run: |
          for f in captures-iphone/*.png; do
            [ -e "$f" ] || continue
            echo "=== CAPTURE $(basename "$f" .png)"
            sips -Z 720 -s format jpeg -s formatOptions 60 "$f" --out /tmp/c.jpg > /dev/null
            base64 -i /tmp/c.jpg | tr -d '\n'
            echo
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: captures-iphone
          path: captures-iphone
