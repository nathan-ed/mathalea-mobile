# Construit l'app pour toutes les plateformes et la joint à une release brouillon.
# Tourne sur un miroir GitHub privé ; scripts/release.sh range ensuite les
# fichiers dans releases/ du dépôt de la forge (dépôt de référence).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version (ex. v0.2.0)
        required: true
      cibles:
        description: Ce qu'il faut construire
        type: choice
        options: [tout, bureau, android]
        default: tout

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  moteur:
    runs-on: ubuntu-latest
    steps:
      # Moteur construit depuis MathALÉA au commit moteur/COMMIT, plus les
      # fichiers de moteur/ (voir moteur/README.md) : rien n'est déposé à la main
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Version de pnpm : champ packageManager de package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/mathalea-mobile
            ~/.local/share/pnpm/store
          key: moteur-${{ hashFiles('moteur/COMMIT') }}
      - run: bash scripts/moteur.sh
      - uses: actions/upload-artifact@v7
        with:
          name: moteur
          path: static/moteur

  bureau:
    needs: moteur
    if: ${{ !inputs.cibles || inputs.cibles == 'tout' || inputs.cibles == 'bureau' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, args: '' }
          - { os: windows-latest, args: '' }
          - { os: macos-latest, args: '--target aarch64-apple-darwin' }
          - { os: macos-15-intel, args: '--target x86_64-apple-darwin' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: moteur
          path: static/moteur
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Version de pnpm : champ packageManager de package.json
      - uses: pnpm/action-setup@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Dépendances Rust compilées gardées d'une release à l'autre
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.VERSION }}
          releaseName: MathALÉA ${{ env.VERSION }}
          releaseDraft: true
          args: ${{ matrix.args }}

  android:
    needs: moteur
    if: ${{ !inputs.cibles || inputs.cibles == 'tout' || inputs.cibles == 'android' }}
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: moteur
          path: static/moteur
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Version de pnpm : champ packageManager de package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # SDK Android déjà présent sur les machines GitHub
      - name: NDK et plateforme Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      # Dépendances Rust compilées gardées d'une release à l'autre
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Clé de signature (si fournie)
        if: env.ANDROID_KEYSTORE != ''
        env:
          CLE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
          CLE_MOT_DE_PASSE: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLE_MOT_DE_PASSE_CLE: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/cle-android.sh "$RUNNER_TEMP/mathalea.jks"
      - name: APK
        env:
          NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: pnpm tauri android build --apk --split-per-abi --target aarch64 --target armv7
      # Signature v1 en plus (AGP ne la pose pas avec minSdk 24 ; MIUI la veut)
      - name: Signatures v1, v2 et v3
        if: env.ANDROID_KEYSTORE != ''
        run: scripts/signer-apk.sh src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
      - name: Joindre l'APK à la release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          draft: true
          files: src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
      # Google Play : Android App Bundle signé avec la clé d'importation
      # (secrets ANDROID_UPLOAD_*) ; sans elle, avec la clé des APK. Google signe
      # ensuite l'app distribuée (Signature d'application Play). Le .aab ne sert
      # qu'à la Play Console : il est un artefact du job, pas un fichier de la release.
      - name: Clé d'importation Google Play (si fournie)
        if: env.ANDROID_UPLOAD_KEYSTORE != ''
        env:
          CLE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          CLE_MOT_DE_PASSE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          CLE_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          CLE_MOT_DE_PASSE_CLE: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: scripts/cle-android.sh "$RUNNER_TEMP/importation.jks"
      - name: AAB (Google Play)
        env:
          NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
          # Règles de Google Play : pas de moteur téléchargé, celui de l'app seulement
          MATHALEA_MOTEUR_FIGE: '1'
        run: |
          # Numéro de version interne daté, comme la version hebdomadaire (google-play.yml)
          code=$(date -u +%y%m%d%H)
          pnpm tauri android build --aab --target aarch64 --target armv7 --target x86_64 \
            --config "{\"bundle\":{\"android\":{\"versionCode\":$code}}}"
          mkdir -p aab
          cp src-tauri/gen/android/app/build/outputs/bundle/*/*.aab "aab/MathALEA-${VERSION#v}-google-play.aab"
      - uses: actions/upload-artifact@v7
        with:
          name: google-play
          path: aab/*.aab
