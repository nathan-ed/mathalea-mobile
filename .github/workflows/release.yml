# Construit l'app pour toutes les plateformes et la joint à une release brouillon.
# Tourne sur un miroir GitHub privé ; scripts/release.sh range ensuite les
# fichiers dans releases/ du dépôt de la forge (dépôt de référence).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version (ex. v0.2.0)
        required: true
      cibles:
        description: Ce qu'il faut construire
        type: choice
        options: [tout, bureau, android]
        default: tout

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  moteur:
    runs-on: ubuntu-latest
    steps:
      # Moteur construit depuis MathALÉA au commit moteur/COMMIT, plus les
      # fichiers de moteur/ (voir moteur/README.md) : rien n'est déposé à la main
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mathalea-mobile
            ~/.local/share/pnpm/store
          key: moteur-${{ hashFiles('moteur/COMMIT') }}
      - run: bash scripts/moteur.sh
      - uses: actions/upload-artifact@v4
        with:
          name: moteur
          path: static/moteur

  bureau:
    needs: moteur
    if: ${{ !inputs.cibles || inputs.cibles == 'tout' || inputs.cibles == 'bureau' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, args: '' }
          - { os: windows-latest, args: '' }
          - { os: macos-latest, args: '--target aarch64-apple-darwin' }
          - { os: macos-15-intel, args: '--target x86_64-apple-darwin' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: moteur
          path: static/moteur
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: dtolnay/rust-toolchain@stable
      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Dépendances Rust compilées gardées d'une release à l'autre
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.VERSION }}
          releaseName: MathALÉA ${{ env.VERSION }}
          releaseDraft: true
          args: ${{ matrix.args }}

  android:
    needs: moteur
    if: ${{ !inputs.cibles || inputs.cibles == 'tout' || inputs.cibles == 'android' }}
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: moteur
          path: static/moteur
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # SDK Android déjà présent sur les machines GitHub
      - name: NDK et plateforme Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      # Dépendances Rust compilées gardées d'une release à l'autre
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Clé de signature (si fournie)
        if: env.ANDROID_KEYSTORE != ''
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/mathalea.jks"
          {
            echo "storeFile=$RUNNER_TEMP/mathalea.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > src-tauri/gen/android/keystore.properties
      - name: APK
        env:
          NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: pnpm tauri android build --apk --split-per-abi --target aarch64 --target armv7
      - name: Joindre l'APK à la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          draft: true
          files: src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
