# Construit l'app pour toutes les plateformes et la joint à une release brouillon.
# Tourne sur un miroir GitHub privé ; scripts/release.sh range ensuite les
# fichiers dans releases/ du dépôt de la forge (dépôt de référence).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version (ex. v0.2.0)
        required: true
      cibles:
        description: Ce qu'il faut construire
        type: choice
        options: [tout, bureau, android]
        default: tout
      essai:
        description: Essai (construire et signer, sans rien joindre à la release)
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  moteur:
    runs-on: ubuntu-latest
    steps:
      # Moteur construit depuis MathALÉA au commit moteur/COMMIT, plus les
      # fichiers de moteur/ (voir moteur/README.md) : rien n'est déposé à la main
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Version de pnpm : champ packageManager de package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/mathalea-mobile
            ~/.local/share/pnpm/store
          key: moteur-${{ hashFiles('moteur/COMMIT') }}
      - run: bash scripts/moteur.sh
      - uses: actions/upload-artifact@v7
        with:
          name: moteur
          path: static/moteur

  # Parcours de l'app au doigt et au clavier, comme un élève : aucun binaire
  # n'est construit si une suite échoue (0.4.6 et 0.4.7 sont parties avec des
  # écrans qui ne défilaient plus au doigt). Suites lancées avec pnpm dev seul.
  e2e:
    needs: moteur
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suites:
          - defilement un-toucher regressions changer-appareil reponses-elements retour
          - classe-qr en-classe fiche-parcours session-qr session-qr-long auteurs
          - ouverture-paliers paliers papier recherche correction-parcours catalogue-moteur
          - reponses-session revisions test-niveau test-niveau-reel impression
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: moteur
          path: static/moteur
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Version de pnpm : champ packageManager de package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm test
      - run: bash scripts/e2e-ci.sh ${{ matrix.suites }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: captures-e2e-${{ strategy.job-index }}
          path: ${{ runner.temp }}/captures

  # Windows, macOS, Linux. Construit par la CLI de Tauri (aucun secret ne va à
  # une action tierce) : fichiers de mise à jour signés (clé TAURI_SIGNING_*,
  # voir src-tauri/src/maj.rs) et, sur Mac, app et .dmg signés Developer ID et
  # notarisés (secrets APPLE_DEVID_*, voir docs/iphone.md). Sans ces secrets,
  # les mêmes fichiers sans signature.
  bureau:
    needs: [moteur, e2e]
    if: ${{ !inputs.cibles || inputs.cibles == 'tout' || inputs.cibles == 'bureau' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, cible: x86_64-unknown-linux-gnu, nom: linux }
          - { os: windows-latest, cible: x86_64-pc-windows-msvc, nom: windows }
          - { os: macos-latest, cible: aarch64-apple-darwin, nom: macos-apple-silicon }
          - { os: macos-15-intel, cible: x86_64-apple-darwin, nom: macos-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Notes de version
        shell: bash
        run: |
          f="docs/notes-de-version/$VERSION.md"
          test -s "$f" || { echo "Note de version manquante : $f"; exit 1; }
      # Les secrets ne vont qu'aux étapes de ce fichier (jamais à une action tierce)
      - name: Clés fournies
        id: cles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_DEVID_CERTIFICATE: ${{ secrets.APPLE_DEVID_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          echo "maj=${TAURI_SIGNING_PRIVATE_KEY:+oui}" >> "$GITHUB_OUTPUT"
          if [ "$RUNNER_OS" = macOS ] && [ -n "$APPLE_DEVID_CERTIFICATE" ] && [ -n "$APPLE_ID" ]; then
            echo "mac=oui" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        with:
          name: moteur
          path: static/moteur
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Version de pnpm : champ packageManager de package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.cible }}
      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Dépendances Rust compilées gardées d'une release à l'autre
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      # Trousseau temporaire : certificat Developer ID et autorité intermédiaire
      # d'Apple (G2), accessibles à codesign sans fenêtre de mot de passe
      - name: Certificat Developer ID
        if: steps.cles.outputs.mac
        env:
          APPLE_DEVID_CERTIFICATE: ${{ secrets.APPLE_DEVID_CERTIFICATE }}
          APPLE_DEVID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVID_CERTIFICATE_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signature.keychain-db"
          mdp=$(openssl rand -hex 24)
          security create-keychain -p "$mdp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$mdp" "$kc"
          printf '%s' "$APPLE_DEVID_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security import "$RUNNER_TEMP/devid.p12" -k "$kc" -P "$APPLE_DEVID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/devid.p12"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/g2.cer"
          security import "$RUNNER_TEMP/g2.cer" -k "$kc" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$mdp" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identite=$(security find-identity -v -p codesigning "$kc" | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')
          [ -n "$identite" ] || { echo "::error::Aucune identité Developer ID Application dans le certificat"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$identite" >> "$GITHUB_ENV"
          # Runtime renforcé (exigé pour la notarisation) : la caméra (QR codes)
          # doit alors être déclarée, sinon macOS la refuse sans rien demander
          cat > "$RUNNER_TEMP/droits.plist" <<'FIN'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.device.camera</key>
            <true/>
          </dict>
          </plist>
          FIN
          plutil -lint "$RUNNER_TEMP/droits.plist"
      # Sur Mac, la CLI signe l'app avec l'identité du trousseau, la notarise
      # (APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID) et agrafe le ticket
      - name: Construire
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ID_APPLE: ${{ secrets.APPLE_ID }}
          MOT_DE_PASSE_APPLE: ${{ secrets.APPLE_APP_PASSWORD }}
          EQUIPE_APPLE: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          MAJ: ${{ steps.cles.outputs.maj }}
          MAC: ${{ steps.cles.outputs.mac }}
        run: |
          if [ -n "$MAJ" ]; then maj=true; else maj=false; fi
          if [ -n "$MAC" ]; then
            export APPLE_ID="$ID_APPLE" APPLE_PASSWORD="$MOT_DE_PASSE_APPLE" APPLE_TEAM_ID="$EQUIPE_APPLE"
            mac=",\"macOS\":{\"entitlements\":\"$RUNNER_TEMP/droits.plist\",\"hardenedRuntime\":true}"
          else
            mac=""
          fi
          pnpm tauri build --target ${{ matrix.cible }} \
            --config "{\"bundle\":{\"createUpdaterArtifacts\":$maj$mac}}"
      # Le .dmg lui-même : signé, notarisé et agrafé (ouverture sans alerte,
      # même hors ligne)
      - name: DMG signé et notarisé
        if: steps.cles.outputs.mac
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          # Serveurs d'Apple (tickets) parfois injoignables un instant : jusqu'à 5 essais
          essayer() { for i in 1 2 3 4 5; do "$@" && return 0; echo "Essai $i raté, nouvel essai dans 30 s"; sleep 30; done; return 1; }
          dossier="src-tauri/target/${{ matrix.cible }}/release/bundle"
          dmg=$(ls "$dossier"/dmg/*.dmg | head -1)
          app=$(ls -d "$dossier"/macos/*.app | head -1)
          codesign -d --entitlements - "$app" 2>&1 | grep -q com.apple.security.device.camera
          # Tauri agrafe le ticket juste après la notarisation, parfois avant
          # qu'Apple l'ait publié (échec silencieux, vu sur Intel le 5 novembre
          # 2026) : nouvel essai ici. Sans ticket agrafé, macOS vérifie l'app en
          # ligne à la première ouverture (spctl ci-dessous le contrôle).
          if ! xcrun stapler validate "$app" > /dev/null 2>&1; then
            essayer xcrun stapler staple "$app" || echo "::warning::Ticket non agrafé à l'app (notarisée, vérifiée en ligne par macOS)"
          fi
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --timeout 30m
          essayer xcrun stapler staple "$dmg"
          essayer xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"
          spctl --assess --type execute -vv "$app"
      # Noms repris par scripts/release.sh ; l'archive de mise à jour du Mac
      # (MathALEA.app.tar.gz) porte l'architecture, comme le .dmg
      - name: Rassembler
        shell: bash
        run: |
          b="src-tauri/target/${{ matrix.cible }}/release/bundle"
          mkdir -p dist
          shopt -s nullglob
          for f in "$b"/appimage/*.AppImage* "$b"/deb/*.deb "$b"/rpm/*.rpm \
                   "$b"/nsis/*-setup.exe* "$b"/msi/*.msi* "$b"/dmg/*.dmg; do
            cp "$f" dist/
          done
          case "${{ matrix.cible }}" in aarch64-apple-darwin) arch=aarch64 ;; *) arch=x64 ;; esac
          for f in "$b"/macos/*.app.tar.gz*; do
            cp "$f" "dist/MathALEA_${VERSION#v}_$arch.app.tar.gz${f##*.app.tar.gz}"
          done
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: bureau-${{ matrix.nom }}
          path: dist/*
      # Les étapes finales des actions tierces ne doivent plus trouver de clé
      - name: Effacer le trousseau
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/signature.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/devid.p12"

  # Release GitHub brouillon (créée si besoin), installateurs et signatures de
  # mise à jour (.sig) joints ; scripts/release.sh en fait latest.json sur la forge
  publier:
    needs: bureau
    if: ${{ !cancelled() && !inputs.essai && needs.bureau.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bureau-*
          merge-multiple: true
          path: dist
      - name: Joindre à la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$VERSION" > /dev/null 2>&1; then
            gh release create "$VERSION" --draft --title "MathALÉA $VERSION" \
              --notes-file "docs/notes-de-version/$VERSION.md"
          fi
          gh release upload "$VERSION" dist/* --clobber

  android:
    needs: [moteur, e2e]
    if: ${{ !inputs.cibles || inputs.cibles == 'tout' || inputs.cibles == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Les secrets ne vont qu'aux étapes de ce fichier (jamais à une action tierce)
      - name: Clés fournies
        id: cles
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
        run: |
          echo "apk=${ANDROID_KEYSTORE:+oui}" >> "$GITHUB_OUTPUT"
          echo "importation=${ANDROID_UPLOAD_KEYSTORE:+oui}" >> "$GITHUB_OUTPUT"
      - name: Notes de version
        shell: bash
        run: |
          f="docs/notes-de-version/$VERSION.md"
          test -s "$f" || { echo "Note de version manquante : $f"; exit 1; }
          { echo 'NOTES<<FIN_NOTES'; cat "$f"; echo; echo 'FIN_NOTES'; } >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: moteur
          path: static/moteur
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Version de pnpm : champ packageManager de package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # SDK Android déjà présent sur les machines GitHub
      - name: NDK et plateforme Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      # Dépendances Rust compilées gardées d'une release à l'autre
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Clé de signature (si fournie)
        if: steps.cles.outputs.apk
        env:
          CLE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
          CLE_MOT_DE_PASSE: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLE_MOT_DE_PASSE_CLE: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/cle-android.sh "$RUNNER_TEMP/mathalea.jks"
      - name: APK
        env:
          NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
        run: pnpm tauri android build --apk --split-per-abi --target aarch64 --target armv7
      # Signature v1 en plus (AGP ne la pose pas avec minSdk 24 ; MIUI la veut)
      - name: Signatures v1, v2 et v3
        if: steps.cles.outputs.apk
        run: scripts/signer-apk.sh src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
      - name: Joindre l'APK à la release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.VERSION }}
          body: ${{ env.NOTES }}
          draft: true
          files: src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
      # Google Play : Android App Bundle signé avec la clé d'importation
      # (secrets ANDROID_UPLOAD_*) ; sans elle, avec la clé des APK. Google signe
      # ensuite l'app distribuée (Signature d'application Play). Le .aab ne sert
      # qu'à la Play Console : il est un artefact du job, pas un fichier de la release.
      - name: Clé d'importation Google Play (si fournie)
        if: steps.cles.outputs.importation
        env:
          CLE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          CLE_MOT_DE_PASSE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          CLE_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          CLE_MOT_DE_PASSE_CLE: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: scripts/cle-android.sh "$RUNNER_TEMP/importation.jks"
      - name: AAB (Google Play)
        env:
          NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
          # Règles de Google Play : pas de moteur téléchargé, celui de l'app seulement
          MATHALEA_MOTEUR_FIGE: '1'
        run: |
          # Numéro de version interne daté, comme la version hebdomadaire (google-play.yml)
          code=$(date -u +%y%m%d%H)
          pnpm tauri android build --aab --target aarch64 --target armv7 --target x86_64 \
            --config "{\"bundle\":{\"android\":{\"versionCode\":$code}}}"
          mkdir -p aab
          cp src-tauri/gen/android/app/build/outputs/bundle/*/*.aab "aab/MathALEA-${VERSION#v}-google-play.aab"
      - uses: actions/upload-artifact@v7
        with:
          name: google-play
          path: aab/*.aab
      # Les étapes finales des actions tierces ne doivent plus trouver de clé
      - name: Effacer les clés
        if: always()
        run: rm -f "$RUNNER_TEMP"/*.jks src-tauri/gen/android/keystore.properties
