# APK d'essai de la branche, construites ici plutôt que sur la machine de
# Nathan (mémoire et disque limités) : arm64 pour un téléphone, x86_64 pour
# l'émulateur. Sans LTO (plus rapide), clé de test, moteur publié sur
# mathalea.fr. Artefact « apk-essai », à ranger dans releases/essai/.
name: apk-essai

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Version de pnpm : champ packageManager de package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: NDK et plateforme Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: essai
      - run: pnpm install --frozen-lockfile
      - name: Moteur publié
        run: node scripts/moteur-publie.mjs
      - name: Clé de test
        env:
          CLE_BASE64: ${{ secrets.ANDROID_KEYSTORE }}
          CLE_MOT_DE_PASSE: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLE_MOT_DE_PASSE_CLE: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/cle-android.sh "$RUNNER_TEMP/essai.jks"
      - name: APK
        env:
          NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
          CARGO_PROFILE_RELEASE_LTO: 'false'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_PROFILE_RELEASE_OPT_LEVEL: '2'
        run: |
          pnpm tauri android build --apk --split-per-abi --target aarch64 --target x86_64
          scripts/signer-apk.sh src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
          v=$(node -p "require('./package.json').version")
          mkdir -p apk
          cp src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk "apk/MathALEA-$v-${GITHUB_SHA::7}-android-arm64.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/x86_64/release/*.apk "apk/MathALEA-$v-${GITHUB_SHA::7}-android-x86_64.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: apk-essai
          path: apk/*.apk
      # Les étapes finales des actions tierces ne doivent plus trouver de clé
      - name: Effacer les clés
        if: always()
        run: rm -f "$RUNNER_TEMP"/*.jks src-tauri/gen/android/keystore.properties
