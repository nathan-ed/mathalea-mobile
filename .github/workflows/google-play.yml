# Version Google Play chaque semaine, si mathalea.fr a publié un nouveau moteur.
# Les boutiques interdisent de télécharger du code qui change l'app : leur
# version embarque le moteur (MATHALEA_MOTEUR_FIGE=1) et le reçoit par une mise
# à jour de l'app. Celle-ci reprend le moteur publié (signature, taille et
# SHA-256 vérifiés : scripts/moteur-publie.mjs), le code de l'app au dernier
# tag v*, et un numéro de version interne daté (toujours croissant).
# Envoi à la Play Console si le secret GOOGLE_PLAY_SERVICE_ACCOUNT existe ;
# sinon, le .aab reste un artefact du job.
name: google-play

on:
  schedule:
    - cron: '0 3 * * 1' # lundi, 3 h UTC
  workflow_dispatch:
    inputs:
      forcer:
        description: Construire même si le moteur n'a pas changé
        type: boolean
        default: false
      piste:
        description: Piste de la Play Console
        type: choice
        options: [internal, alpha, beta, production]
        default: production
      essai:
        description: Essai à blanc (envoie le bundle mais ne publie rien)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  google-play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Les secrets ne vont qu'aux étapes de ce fichier (jamais à une action tierce)
      - name: Clés fournies
        id: cles
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          echo "signature=${ANDROID_UPLOAD_KEYSTORE:+oui}${ANDROID_KEYSTORE:+oui}" >> "$GITHUB_OUTPUT"
          echo "compte=${GOOGLE_PLAY_SERVICE_ACCOUNT:+oui}" >> "$GITHUB_OUTPUT"
      # Code de l'app : la dernière version publiée (tag v*)
      - name: Dernière version de l'app
        run: |
          # Script du moteur publié pris sur la branche principale, avant de changer de version
          cp scripts/moteur-publie.mjs scripts/cle-android.sh scripts/e2e-ci.sh "$RUNNER_TEMP/"
          tag=$(git describe --tags --abbrev=0 --match 'v*')
          git checkout "$tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Moteur publié
        run: echo "MOTEUR=$(node "$RUNNER_TEMP/moteur-publie.mjs" --version)" >> "$GITHUB_ENV"
      # Moteur déjà envoyé à Google Play : rien à faire
      - name: Déjà envoyé ?
        id: deja
        uses: actions/cache@v6
        with:
          path: .moteur-envoye
          key: google-play-${{ env.TAG }}-${{ env.MOTEUR }}
          lookup-only: true
      - name: Rien de nouveau
        if: steps.deja.outputs.cache-hit == 'true' && !inputs.forcer
        run: echo "Moteur $MOTEUR et app $TAG déjà envoyés à Google Play."
      - name: Suite
        id: suite
        if: steps.deja.outputs.cache-hit != 'true' || inputs.forcer
        run: echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Moteur dans l'app
        if: steps.suite.outputs.ok
        run: node "$RUNNER_TEMP/moteur-publie.mjs"
      # Version de pnpm : champ packageManager de package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: steps.suite.outputs.ok
      - uses: actions/setup-java@v6
        if: steps.suite.outputs.ok
        with:
          distribution: temurin
          java-version: 21
      - name: NDK et plateforme Android
        if: steps.suite.outputs.ok
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.suite.outputs.ok
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.suite.outputs.ok
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
        if: steps.suite.outputs.ok
      # L'app de la boutique, avec le moteur publié, parcourue au doigt comme
      # un élève : rien n'est envoyé si une suite échoue (0.4.6 et 0.4.7 sont
      # parties avec des écrans qui ne défilaient plus au doigt)
      - name: Parcours e2e
        if: steps.suite.outputs.ok
        run: |
          cp "$RUNNER_TEMP/e2e-ci.sh" scripts/e2e-ci.sh
          bash scripts/e2e-ci.sh defilement un-toucher regressions changer-appareil test-niveau-reel reponses-elements formats
      # Clé d'importation de Google Play ; à défaut, celle des APK
      - name: Clé de signature
        if: steps.suite.outputs.ok && steps.cles.outputs.signature
        env:
          CLE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE || secrets.ANDROID_KEYSTORE }}
          CLE_MOT_DE_PASSE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE && secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLE_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE && secrets.ANDROID_UPLOAD_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          CLE_MOT_DE_PASSE_CLE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE && secrets.ANDROID_UPLOAD_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        # Le script vient de la branche principale (le tag peut être plus ancien)
        run: PROPRIETES=src-tauri/gen/android/keystore.properties bash "$RUNNER_TEMP/cle-android.sh" "$RUNNER_TEMP/cle.jks"
      # Numéro de version interne daté (AAMMJJHH) : toujours plus grand que le précédent
      - name: AAB
        if: steps.suite.outputs.ok
        env:
          NDK_HOME: /usr/local/lib/android/sdk/ndk/27.2.12479018
          MATHALEA_MOTEUR_FIGE: '1'
        run: |
          code=$(date -u +%y%m%d%H)
          pnpm tauri android build --aab --target aarch64 --target armv7 --target x86_64 \
            --config "{\"bundle\":{\"android\":{\"versionCode\":$code}}}"
          mkdir -p aab
          cp src-tauri/gen/android/app/build/outputs/bundle/*/*.aab "aab/MathALEA-${TAG#v}-moteur-${MOTEUR%%+*}-google-play.aab"
          {
            echo "## Version Google Play"
            echo "App $TAG, moteur $MOTEUR, numéro interne $code"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: steps.suite.outputs.ok
        with:
          name: google-play
          path: aab/*.aab
      # Sans note de version, la Play Console bloque la review : 500 caractères
      # au plus, lue sur la branche principale (le tag peut être plus ancien).
      # Envoi par scripts/envoyer-google-play.mjs (API Google Play, sans action tierce)
      - name: Envoi à la Play Console
        if: steps.suite.outputs.ok && steps.cles.outputs.compte
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          git show "origin/main:docs/notes-de-version/$TAG.play.txt" > "$RUNNER_TEMP/note-play.txt" \
            || { echo "Note Play manquante : docs/notes-de-version/$TAG.play.txt"; exit 1; }
          git show origin/main:scripts/envoyer-google-play.mjs > "$RUNNER_TEMP/envoyer-google-play.mjs"
          node "$RUNNER_TEMP/envoyer-google-play.mjs" aab/*.aab "${{ inputs.piste || 'production' }}" "$RUNNER_TEMP/note-play.txt" ${{ inputs.essai && '--essai' || '' }}
      # Retenu comme envoyé seulement après un envoi réussi
      - name: Moteur envoyé
        if: steps.suite.outputs.ok && steps.cles.outputs.compte && !inputs.essai
        run: echo "$MOTEUR" > .moteur-envoye
      - uses: actions/cache/save@v6
        if: steps.suite.outputs.ok && steps.cles.outputs.compte && !inputs.essai
        with:
          path: .moteur-envoye
          key: google-play-${{ env.TAG }}-${{ env.MOTEUR }}
      # Les étapes finales des actions tierces ne doivent plus trouver de clé
      - name: Effacer les clés
        if: always()
        run: rm -f "$RUNNER_TEMP"/*.jks src-tauri/gen/android/keystore.properties
