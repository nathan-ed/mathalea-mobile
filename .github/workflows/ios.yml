# Version iOS, construite sur macOS (aucun Mac nécessaire en local).
# Sans clé Apple : compilation pour le simulateur, lancement de l'app et
# captures (clair, sombre) en artefacts, plus le projet Xcode généré.
# Avec les secrets App Store Connect : .ipa signée, envoyée à TestFlight.
# Comme toutes les apps, elle embarque notre moteur (scripts/moteur.sh),
# construit sous Linux (sous macOS, pnpm ne passe pas à la version demandée par
# MathALÉA) ; iOS ne télécharge jamais de moteur (moteur.rs, MISES_A_JOUR).
# Pas à pas depuis un ordinateur sans Mac : docs/iphone.md.
name: ios

on:
  workflow_dispatch:
    inputs:
      envoi:
        description: Signer et envoyer à TestFlight (secrets Apple requis)
        type: boolean
        default: false
      ipa:
        description: Construire aussi une .ipa non signée (Sideloadly, AltStore)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  moteur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - name: Moteur dans l'app
        run: bash scripts/moteur.sh
      - uses: actions/upload-artifact@v7
        with:
          name: moteur
          path: static/moteur

  ios:
    needs: moteur
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # Les secrets ne vont qu'aux étapes de ce fichier (jamais à une action tierce)
      - name: Clés fournies
        id: cles
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: echo "apple=${APPLE_API_KEY_P8:+oui}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Version de pnpm : champ packageManager de package.json
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: moteur
          path: static/moteur
      # Notre moteur : commit de MathALÉA et empreinte de moteur/ (comme scripts/moteur.sh)
      - name: Moteur
        run: echo "MOTEUR=$(cut -c1-9 moteur/COMMIT).$(cd moteur && find . -type f -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -c1-7)" >> "$GITHUB_ENV"
      # Projet Xcode : généré s'il n'est pas encore dans le dépôt (src-tauri/gen/apple)
      - name: Projet Xcode
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            brew install xcodegen
            pnpm tauri ios init --ci
          fi
      # Manifeste de confidentialité exigé par Apple : dans le dossier de
      # l'app (source du projet), projet régénéré pour l'embarquer
      - name: Manifeste de confidentialité
        run: |
          cp src-tauri/PrivacyInfo.xcprivacy src-tauri/gen/apple/mathalea-mobile_iOS/
          command -v xcodegen > /dev/null || brew install xcodegen
          (cd src-tauri/gen/apple && xcodegen generate)
          grep -q PrivacyInfo.xcprivacy src-tauri/gen/apple/mathalea-mobile.xcodeproj/project.pbxproj
      - uses: actions/upload-artifact@v7
        with:
          name: projet-xcode
          path: |
            src-tauri/gen/apple
            !src-tauri/gen/apple/build
            !src-tauri/gen/apple/Externals

      # Simulateur : compilation, lancement et captures
      - name: Simulateur
        if: ${{ !inputs.envoi }}
        run: pnpm tauri ios build --target aarch64-sim --debug
      - name: Captures
        if: ${{ !inputs.envoi }}
        run: |
          app=$(find src-tauri/gen/apple/build -name '*.app' -path '*simulator*' | head -1)
          [ -n "$app" ] || app=$(find src-tauri/gen/apple/build -name '*.app' | head -1)
          echo "App : $app"
          appareil=$(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8")).devices
            const t = Object.entries(d).filter(([k]) => k.includes("iOS")).flatMap(([, l]) => l)
            console.log((t.find((x) => /^iPhone \d+$/.test(x.name)) ?? t.find((x) => x.name.startsWith("iPhone"))).udid)')
          xcrun simctl boot "$appareil"
          xcrun simctl bootstatus "$appareil" -b
          xcrun simctl install "$appareil" "$app"
          mkdir -p captures
          for apparence in light dark; do
            xcrun simctl ui "$appareil" appearance "$apparence"
            xcrun simctl launch "$appareil" fr.coopmaths.mathalea
            sleep 25
            xcrun simctl io "$appareil" screenshot "captures/ios-$apparence.png"
            xcrun simctl terminate "$appareil" fr.coopmaths.mathalea || true
          done
          xcrun simctl spawn "$appareil" log show --last 5m --predicate 'process == "mathalea-mobile"' --style compact | tail -100 > captures/journal.txt || true
      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.envoi && always() }}
        with:
          name: captures-ios
          path: captures

      # .ipa non signée pour iPhone et iPad : la personne la signe avec son
      # identifiant Apple (Sideloadly, AltStore ; valable 7 jours sans compte
      # développeur). Signature coupée dans le projet, archive puis Payload/.
      - name: IPA non signée
        if: inputs.ipa
        run: |
          bash scripts/ios-sans-signature.sh
          pnpm tauri ios build --target aarch64 || echo "Export refusé sans signature : on reprend l'archive"
          app=$(find src-tauri/gen/apple/build ~/Library/Developer/Xcode -path '*.xcarchive/Products/Applications/*.app' -prune 2>/dev/null | head -1)
          echo "App : $app"
          [ -n "$app" ]
          mkdir -p ipa-libre/Payload
          cp -R "$app" ipa-libre/Payload/
          v=$(node -p "require('./package.json').version")
          (cd ipa-libre && zip -qry "../MathALEA-$v-ios-non-signee.ipa" Payload)
          ls -la MathALEA-*-ios-non-signee.ipa
      - uses: actions/upload-artifact@v7
        if: inputs.ipa
        with:
          name: ipa-non-signee
          path: MathALEA-*-ios-non-signee.ipa

      # TestFlight : signature automatique par la clé d'API App Store Connect
      - name: Clé d'API
        if: inputs.envoi && steps.cles.outputs.apple
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          echo "$APPLE_API_KEY_P8" > ~/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8" >> "$GITHUB_ENV"
      # Numéro de compilation daté (AAMMJJHH) : toujours plus grand que le précédent
      - name: IPA
        if: inputs.envoi && steps.cles.outputs.apple
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          pnpm tauri ios build --target aarch64 --export-method app-store-connect --build-number "$(date -u +%y%m%d%H)"
          mkdir -p ipa
          cp src-tauri/gen/apple/build/arm64/*.ipa "ipa/MathALEA-moteur-${MOTEUR%%+*}.ipa"
      - uses: actions/upload-artifact@v7
        if: inputs.envoi && steps.cles.outputs.apple
        with:
          name: app-store
          path: ipa/*.ipa
      - name: Envoi à TestFlight
        if: inputs.envoi && steps.cles.outputs.apple
        run: xcrun altool --upload-app --type ios --file ipa/*.ipa --apiKey "${{ secrets.APPLE_API_KEY_ID }}" --apiIssuer "${{ secrets.APPLE_API_ISSUER }}"
      - name: Secrets absents
        if: inputs.envoi && !steps.cles.outputs.apple
        run: |
          echo "::error::Secrets APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER et APPLE_DEVELOPMENT_TEAM requis pour TestFlight."
          exit 1
      # Les étapes finales des actions tierces ne doivent plus trouver de clé
      - name: Effacer les clés
        if: always()
        run: rm -rf ~/private_keys
