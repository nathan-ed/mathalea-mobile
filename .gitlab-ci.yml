# Forge : vérifications à chaque push. Les binaires sont construits sur le
# miroir GitHub (.github/workflows/release.yml) puis recopiés ici par
# scripts/release.sh (voir docs/developpement.md).
verifier:
  image: node:22
  script:
    # pnpm fixé par packageManager (package.json) : la dernière version
    # refuserait des paquets publiés depuis moins de 24 h
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm check
    - pnpm test

# Pages de la forge (publiques, le dépôt reste privé) : guide de l'application
# (docs/guide, scripts/guide.mjs) et politique de confidentialité, adresse
# donnée aux boutiques :
# https://coopmaths.forge.apps.education.fr/mathalea-mobile/confidentialite.html
pages:
  image: node:22-alpine
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - node scripts/guide.mjs public
    - cp static/confidentialite.html static/favicon.png public/
  artifacts:
    paths:
      - public
